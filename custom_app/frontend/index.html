<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AWP 知识库助手 · 对话</title>
    <link rel="icon" href="/frontend/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/frontend/style.css">
  </head>
  <body>
    <div id="app" class="app-shell chat-shell" data-page="chat">
      <aside class="chat-sidebar" aria-label="对话侧栏">
        <section>
          <h1 class="brand-title">AWP 知识库助手</h1>
          <p class="brand-subtitle">面向企业生产经营相关的私有问答系统</p>
        </section>

        <section class="sidebar-actions" aria-label="对话操作">
          <button class="sidebar-action" type="button" data-role="new-chat">
            <span class="sidebar-action__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z" />
              </svg>
            </span>
            <span>新聊天</span>
          </button>
          <button class="sidebar-action" type="button" data-role="search-chat">
            <span class="sidebar-action__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            </span>
            <span>搜索聊天</span>
          </button>
        </section>

        <section class="sidebar-section">
          <label class="sidebar-caption" for="kb-select">知识库</label>
          <select id="kb-select" class="field" data-role="kb-select">
            <option value="" disabled selected>请选择知识库</option>
          </select>
        </section>

        <section class="sidebar-section" data-role="session-section">
          <span class="sidebar-caption">会话列表</span>
          <div class="session-list-host" data-role="session-list" aria-label="历史会话"></div>
        </section>

        <div class="sidebar-footer" data-role="sidebar-footer">
          <div class="sidebar-user" data-role="sidebar-user" hidden>
            <span class="sidebar-user__icon" aria-hidden="true">👤</span>
            <span class="sidebar-user__name" data-role="user-name">—</span>
          </div>
          <a class="sidebar-link" href="/admin" data-role="admin-link" hidden>管理后台</a>
          <button class="sidebar-link sidebar-logout" type="button" data-role="logout-btn" hidden>退出登录</button>
        </div>
      </aside>

      <main class="chat-workspace">
        <header class="mobile-topbar">
          <button class="icon-button" type="button" aria-label="打开侧栏" data-role="sidebar-toggle">☰</button>
          <strong>AWP 知识库助手</strong>
        </header>

        <section class="message-list" aria-label="消息列表" data-role="message-list">
          <article class="message ai">
            <strong>助手</strong>
            <p>您好，请先选择知识库，然后输入 AGV 操作问题。</p>
            <div class="source-placeholder">引用来源将在回答完成后展示。</div>
          </article>
        </section>

        <footer class="composer">
          <div class="composer-toolbar">
            <select class="agent-select" aria-label="智能体模式" data-role="agent-select">
              <option value="quick">智能体：快速问答</option>
              <option value="agent">智能体：智能推理</option>
            </select>
            <button
              type="button"
              class="model-chip"
              data-role="model-chip"
              aria-label="切换对话模型"
              title="切换对话模型"
            >
              <span data-role="model-chip-name">默认模型</span>
              <span class="model-chip__caret">▾</span>
            </button>
            <label class="deep-toggle" title="深度思考模式：多轮检索 + 推理链，适合跨文档/多步骤问题（耗时 ~2 倍）">
              <input
                type="checkbox"
                data-role="deep-reasoning-toggle"
                aria-label="深度思考模式"
              />
              <span>深度思考</span>
            </label>
            <span class="muted" data-role="char-count">0/500</span>
          </div>
          <div class="composer-row">
            <label class="visually-hidden" for="composer-input">输入问题</label>
            <textarea id="composer-input" class="composer-input" data-role="composer-input" placeholder="输入您的问题，Enter 发送，Shift+Enter 换行"></textarea>
            <button class="send-button" type="button" data-role="send-button">发送</button>
          </div>
        </footer>
      </main>

      <div
        class="chat-sidebar-backdrop"
        data-role="sidebar-backdrop"
        aria-hidden="true"
      ></div>
    </div>

    <script src="/frontend/vendor/marked.min.js"></script>
    <script src="/frontend/vendor/DOMPurify.min.js"></script>
    <script type="module" src="/frontend/main.js"></script>
  </body>
</html>
