<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="login.page_title">AGV 知识库助手 · 登录</title>
    <link rel="icon" href="/frontend/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/frontend/style.css">
    <link rel="stylesheet" href="/frontend/css/login.css">
  </head>
  <body>
    <main class="login-shell" data-page="login">
      <section class="login-card">
        <button
          type="button"
          class="lang-switch"
          data-role="lang-switch"
          aria-label="切换语言"
        >
          🌐 <span data-role="lang-name">English</span>
        </button>

        <h1 data-i18n="login.title">AGV 知识库助手</h1>
        <p data-i18n="login.subtitle">请使用管理员分配的账号登录</p>

        <form class="login-form" id="login-form" autocomplete="on">
          <label>
            <span data-i18n="login.username">用户名</span>
            <input type="text" name="username" id="username" required autocomplete="username" autofocus>
          </label>
          <label>
            <span data-i18n="login.password">密码</span>
            <input type="password" name="password" id="password" required autocomplete="current-password">
          </label>
          <button type="button" id="login-btn" data-i18n="login.submit">登录</button>
          <div id="login-error" role="alert"></div>
        </form>

        <p class="login-hint" data-i18n="login.hint">首次登录默认账号见管理员；登录后请尽快修改密码。</p>
      </section>
    </main>

    <script type="module" src="/frontend/js/login.js"></script>
  </body>
</html>
