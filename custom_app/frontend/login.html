<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AGV 知识库助手 · 登录</title>
    <link rel="icon" href="/frontend/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/frontend/style.css">
    <style>
      .login-form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
      .login-form label { display: flex; flex-direction: column; font-size: 14px; color: #444; }
      .login-form input {
        margin-top: 4px; padding: 8px 10px; font-size: 14px;
        border: 1px solid #ccc; border-radius: 4px;
      }
      .login-form button {
        margin-top: 8px; padding: 10px; font-size: 14px; cursor: pointer;
        background: #2563eb; color: white; border: none; border-radius: 4px;
      }
      .login-form button:hover { background: #1d4ed8; }
      .login-form button:disabled { background: #999; cursor: not-allowed; }
      #login-error {
        margin-top: 8px; padding: 8px; background: #fee; color: #c00;
        border-radius: 4px; display: none; font-size: 13px;
      }
      .login-hint { color: #888; font-size: 12px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main class="login-shell" data-page="login">
      <section class="login-card">
        <h1>AGV 知识库助手</h1>
        <p>请使用管理员分配的账号登录</p>

        <form class="login-form" id="login-form" autocomplete="on">
          <label>
            用户名
            <input type="text" name="username" id="username" required autocomplete="username" autofocus>
          </label>
          <label>
            密码
            <input type="password" name="password" id="password" required autocomplete="current-password">
          </label>
          <button type="submit" id="login-btn">登录</button>
          <div id="login-error" role="alert"></div>
        </form>

        <p class="login-hint">首次登录默认账号见管理员；登录后请尽快修改密码。</p>
      </section>
    </main>

    <script>
      (function () {
        const form = document.getElementById("login-form");
        const errBox = document.getElementById("login-error");
        const btn = document.getElementById("login-btn");

        // 已登录则直接跳对话页
        fetch("/api/auth/me", { credentials: "same-origin" })
          .then(r => r.ok ? r.json() : null)
          .then(data => { if (data && data.data) location.href = "/"; })
          .catch(() => {});

        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          errBox.style.display = "none";
          btn.disabled = true;
          btn.textContent = "登录中…";
          try {
            const resp = await fetch("/api/auth/login", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value,
              }),
            });
            const payload = await resp.json().catch(() => ({}));
            if (resp.ok && payload && payload.data) {
              location.href = "/";
              return;
            }
            errBox.textContent = (payload && payload.error) || "登录失败";
            errBox.style.display = "block";
          } catch (e) {
            errBox.textContent = "网络错误：" + (e && e.message);
            errBox.style.display = "block";
          } finally {
            btn.disabled = false;
            btn.textContent = "登录";
          }
        });
      })();
    </script>
  </body>
</html>
